# Nixpacks build configuration for Railway.
# Pins Node.js to >=20 and declares libvips so Sharp's prebuilt binary
# resolves correctly without a source compile.
# See: https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["nodejs_22", "vips"]

[phases.build]
cmds = [
  "npm install --include=dev --no-audit --no-fund",
  "npm run build:check",
  "npm prune --omit=dev"
]

[start]
# Run node directly: "npm start" keeps an extra npm process (~40 MB) resident.
cmd = "MALLOC_ARENA_MAX=2 MALLOC_MMAP_THRESHOLD_=131072 MALLOC_TRIM_THRESHOLD_=131072 node --max-old-space-size=128 --max-semi-space-size=2 server.js"
